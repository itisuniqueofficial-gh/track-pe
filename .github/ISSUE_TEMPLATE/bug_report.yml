name: Bug report
description: Report a problem with Track Pe
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Do **not** include any UPI IDs, payment details, or secrets.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Web, Linux, macOS, Windows]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App / build version
    validations:
      required: false
